# Include in the realgram.no TLS server only. No general PHP execution is added.
location = /community/room.php {
    client_max_body_size 12k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/realgram/community/room.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    fastcgi_read_timeout 20s;
}
location = /community/Room.php { return 404; }
location /community/ { return 404; }
